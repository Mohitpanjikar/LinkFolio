<!DOCTYPE html>
<html>
<head>
  <title>Canvas Favicon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px 0;
      background-color: #f8f8f8;
    }
    .icon-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }
    .icon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    button {
      background-color: #000;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #333;
    }
    h1 {
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>LinkFolio Favicon Generator</h1>
  
  <p>This tool generates favicon images using canvas. Click the buttons to download the images in various sizes.</p>
  
  <div class="icon-row">
    <div class="icon-container">
      <canvas id="canvas16" width="16" height="16"></canvas>
      <button onclick="downloadCanvas('canvas16', 'favicon-16x16.png')">Download 16x16</button>
    </div>
    
    <div class="icon-container">
      <canvas id="canvas32" width="32" height="32"></canvas>
      <button onclick="downloadCanvas('canvas32', 'favicon-32x32.png')">Download 32x32</button>
    </div>
    
    <div class="icon-container">
      <canvas id="canvas192" width="192" height="192"></canvas>
      <button onclick="downloadCanvas('canvas192', 'icon-192.png')">Download 192x192</button>
    </div>
    
    <div class="icon-container">
      <canvas id="canvas512" width="512" height="512"></canvas>
      <button onclick="downloadCanvas('canvas512', 'icon-512.png')">Download 512x512</button>
    </div>
  </div>
  
  <div class="icon-container">
    <canvas id="canvasApple" width="180" height="180"></canvas>
    <button onclick="downloadCanvas('canvasApple', 'apple-touch-icon.png')">Download Apple Touch Icon</button>
  </div>
  
  <script>
    // Function to draw the LinkFolio logo on a canvas
    function drawLogo(canvas) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      
      // Scale factor for different canvas sizes
      const scale = width / 512;
      
      // Clear canvas
      ctx.clearRect(0, 0, width, height);
      
      // Draw rounded rectangle background
      const cornerRadius = 128 * scale;
      ctx.fillStyle = '#000000';
      
      ctx.beginPath();
      ctx.moveTo(cornerRadius, 0);
      ctx.lineTo(width - cornerRadius, 0);
      ctx.arc(width - cornerRadius, cornerRadius, cornerRadius, -Math.PI/2, 0);
      ctx.lineTo(width, height - cornerRadius);
      ctx.arc(width - cornerRadius, height - cornerRadius, cornerRadius, 0, Math.PI/2);
      ctx.lineTo(cornerRadius, height);
      ctx.arc(cornerRadius, height - cornerRadius, cornerRadius, Math.PI/2, Math.PI);
      ctx.lineTo(0, cornerRadius);
      ctx.arc(cornerRadius, cornerRadius, cornerRadius, Math.PI, 3*Math.PI/2);
      ctx.closePath();
      
      ctx.fill();
      
      // Draw "L" character
      ctx.fillStyle = '#FFFFFF';
      
      // Adjust the path based on canvas size
      const lPath = {
        x1: 144 * scale,
        y1: 144 * scale,
        x2: 144 * scale,
        y2: 304 * scale,
        x3: 224 * scale,
        y3: 304 * scale,
        x4: 224 * scale,
        y4: 368 * scale,
        x5: 368 * scale,
        y5: 368 * scale,
        x6: 368 * scale,
        y6: 304 * scale,
        x7: 288 * scale,
        y7: 304 * scale,
        x8: 288 * scale,
        y8: 144 * scale
      };
      
      ctx.beginPath();
      ctx.moveTo(lPath.x1, lPath.y1);
      ctx.lineTo(lPath.x2, lPath.y2);
      ctx.lineTo(lPath.x3, lPath.y3);
      ctx.lineTo(lPath.x4, lPath.y4);
      ctx.lineTo(lPath.x5, lPath.y5);
      ctx.lineTo(lPath.x6, lPath.y6);
      ctx.lineTo(lPath.x7, lPath.y7);
      ctx.lineTo(lPath.x8, lPath.y8);
      ctx.closePath();
      ctx.fill();
      
      // Draw connection dots
      const dots = [
        { cx: 256 * scale, cy: 256 * scale, r: 16 * scale },
        { cx: 180 * scale, cy: 180 * scale, r: 12 * scale },
        { cx: 332 * scale, cy: 332 * scale, r: 12 * scale }
      ];
      
      dots.forEach(dot => {
        ctx.beginPath();
        ctx.arc(dot.cx, dot.cy, dot.r, 0, 2 * Math.PI);
        ctx.fill();
      });
    }
    
    // Function to download canvas as image
    function downloadCanvas(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    // Initialize all canvases
    window.onload = function() {
      drawLogo(document.getElementById('canvas16'));
      drawLogo(document.getElementById('canvas32'));
      drawLogo(document.getElementById('canvas192'));
      drawLogo(document.getElementById('canvas512'));
      drawLogo(document.getElementById('canvasApple'));
    };
  </script>
</body>
</html>
